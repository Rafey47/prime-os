<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime OS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="desktop">

        <h1>Prime OS</h1>

        <div class="window" id="notes">
            <div class="title-bar">
                <span>Notes</span>
                <button class="close">×</button>
            </div>
            <div class="content">
                Welcome to Prime OS.
            </div>
        </div>

        <div class="window" id="files">
            <div class="title-bar">
                <span>Files</span>
                <button class="close">×</button>
            </div>
            <div class="content">
                📁 Documents<br>
                📁 Projects<br>
                📄 README.txt
            </div>
        </div>

        <div class="window" id="settings">
            <div class="title-bar">
                <span>Settings</span>
                <button class="close">×</button>
            </div>
            <div class="content">
                Prime OS Settings
            </div>
        </div>

        <div class="taskbar">
            <span>Prime OS</span>
            <span id="clock">00:00</span>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
